version: "1.0"
services:
  - name: http-bridge
    type: web
    ports:
      - port: 8080
        protocol: http
    routes:
      - path: /
        port: 8080
    regions:
      - fra
    instance_type: free
    scaling:
      min: 1
      max: 1
    env:
      - key: NODE_ENV
        value: production
